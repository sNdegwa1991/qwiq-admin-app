<ion-header translucent>
  <ion-toolbar>
   <ion-buttons slot="start" color="primary">
     <ion-back-button></ion-back-button>
   </ion-buttons>
    <ion-title color="primary">
      <ion-icon name="person-circle-outline" class="user-icon"></ion-icon>
      {{userName}}
    </ion-title>
  </ion-toolbar>
  </ion-header>

<ion-content #IonContent fullscreen="true">
  <div class="messages-container">
    <ion-grid>
    <ion-row>
      <ion-col size="1">
      </ion-col>
      <ion-col size="11">
        <ion-card style="background-color: rgb(218, 218, 223);padding: 10px;">
          Dear Samuel, welcome to qwiqsoko live chat.  How can we help you?
        </ion-card>
      </ion-col>
    </ion-row>
    </ion-grid>
<!-- ......................................................dynamic -->
<div *ngFor="let p of txtMessage">
    <ion-grid style="margin-top: -30px;">
      <ion-row>
        <ion-col size="11">
          <ion-card style="background-color: rgb(200, 232, 232);padding: 10px;" *ngIf="p.text_in != '0'">
            {{p.text_in}}<br><small style="color: orange;">{{p.date_in}}</small>
           </ion-card>
        </ion-col>
        <ion-col size="1">
          </ion-col>
      </ion-row>
      </ion-grid>

      <ion-grid style="margin-top: -20px;">
        <ion-row>
          <ion-col size="1">
          </ion-col>
          <ion-col size="11">
            <ion-card style="background-color: rgb(218, 218, 223);padding: 10px;" *ngIf="p.text_out != '0'">
              {{p.text_out}}<br> <small style="color: orange;">{{p.date_out}}</small>
              <ion-icon name="checkmark-done-circle-outline"></ion-icon>
             </ion-card>
          </ion-col>
        </ion-row>
        </ion-grid>
  </div>    
<!-- .......................................................... -->
    
</div>
  <ion-fab vertical="bottom" horizontal="end" slot="fixed" (click)="sendMessage()">
    <ion-fab-button color="light">
      <ion-icon name="send" color="success" expand="icon-only"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>

<!-- <ion-footer translucent> -->
  <ion-item vertical="bottom">
    <ion-icon slot="start" name="chatbox-ellipses-outline" expand="icon-only" class="footerIcon"></ion-icon>
    <ion-input class="input-box" id="message-typed" [(ngModel)]="mess" type="text" placeholder="Write a message..."></ion-input>
  </ion-item>
<!-- </ion-footer> -->
