<ion-header>
  <ion-toolbar>
    <ion-title>Ridder Accounts</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-list>
    <ion-item>
      <ion-button slot="end" color="tertiary" (click)="addNewRidderUser()">Add</ion-button>
    </ion-item>

  <ion-item lines="full">
    <ion-grid>
    <ion-row class="table-head">
      <ion-col size="4">Name</ion-col>
      <ion-col size="5">Email</ion-col>
      <ion-col size="3">Status</ion-col>
    </ion-row>
    </ion-grid>
    </ion-item>
    <ion-item lines="full" *ngFor="let u of ridderUsers">
    <ion-grid (click)="openRider(u.user_id)">
      <ion-row>
        <ion-col size="4">{{u.full_name}}</ion-col>
        <ion-col size="5">{{u.email}}</ion-col>
        <ion-col size="3" *ngIf="u.status == 1"><ion-badge color="success">Active</ion-badge></ion-col>
        <ion-col size="3" *ngIf="u.status == 0"><ion-badge color="danger">Inactive</ion-badge></ion-col>
      </ion-row>
    </ion-grid>
  </ion-item>
  </ion-list>

</ion-content>
