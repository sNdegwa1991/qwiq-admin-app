<ion-header>
  <ion-toolbar>
    <ion-title color="primary"><b>
      <ion-icon (click)="backHome()" name="chevron-back-outline"></ion-icon>
      &nbsp;&nbsp;&nbsp;
      Order Number {{orderNumber}}</b></ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-card>
    <ion-card-content>
  <b><ion-icon name="cart-outline"></ion-icon> Supermarket: </b>{{supa}}<br>
  <b><ion-icon name="location-outline"></ion-icon> Drop Point: </b>{{address}},{{information}}<br>
  <ion-button *ngIf="startBtn === 1" (click)="createCart(shoppingList)" size="small" color="primary" fill="outline"><ion-icon name="cash-outline"></ion-icon> Start Shopping</ion-button>
  
</ion-card-content>
   </ion-card>
   <ion-card>
    <ion-card-content>
  <ion-item> Shopping List</ion-item>
  <ion-item lines="full" *ngFor="let p of shoppingList let i=index" class="ion-text-wrap">
    <ion-grid>
      <ion-row>
        <ion-col size="8">
          {{i+1}}. {{p.brand+' '+p.product_name+' ('+p.quantity+')'}} 
        </ion-col>
        <ion-col size="4">
          <input *ngIf="priceColumn === 1" style="width: 100%;height: 50px;" (keyup)="itemPrice($event,p)" required="" id="item_brand" placeholder="price" class="controls" type="number">
        </ion-col>
       </ion-row>
       
    </ion-grid>
   </ion-item>
   <ion-item>
    <ion-button (click)="submitPrices()" *ngIf="submitBtn === 1" size="medium" color="success"><ion-icon name="save-outline"></ion-icon> Submit Prices</ion-button>
   </ion-item>
   <ion-item>
   </ion-item>
   </ion-card-content>
   </ion-card>

</ion-content>
