<ion-header color="primary">
  <ion-toolbar color="primary">
    <ion-title><ion-icon name="reorder-three-outline"></ion-icon> Product List</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-item>
      <ion-label position="floating">Search...</ion-label>
      <ion-input (keyup)="searchProduct($event)" placeholder="Enter product name to Search"></ion-input>
    </ion-item>
  </ion-card>
  <ion-card *ngIf="totalProducts < 1" class="no_order">
    <h4>No Product Found</h4>
  </ion-card>

  <ion-list *ngIf="totalProducts > 0">
    <ion-item>
    <ion-badge slot="end" color="danger">Total: {{totalProducts}}</ion-badge>
    </ion-item>
  
    <ion-item lines="full">
      <ion-grid>
      <ion-row class="table-head">
        <ion-col size="5">Item</ion-col>
        <ion-col size="3">Vendor</ion-col>
        <ion-col size="2">Price</ion-col>
        <ion-col size="2">View</ion-col>
      </ion-row>
      </ion-grid>
      </ion-item>
      <ion-item lines="full" *ngFor="let p of products">
      <ion-grid>
        <ion-row>
          <ion-col size="5">{{p.sub_menu}}</ion-col>
          <ion-col size="3">{{p.restaurant}}</ion-col>
          <ion-col size="2">{{p.price}}</ion-col>
          <ion-col size="2">  <ion-button expand="block" (click)="openModal(p.id)"><ion-icon name="eye-off-outline"></ion-icon></ion-button></ion-col>
        </ion-row>
      </ion-grid>
    </ion-item>
    </ion-list>

</ion-content>
