<ion-header color="primary">
  <ion-toolbar color="primary">
    
    <ion-title> 
      <ion-icon (click)="backHome()" name="chevron-back-outline"></ion-icon>
      &nbsp;&nbsp;&nbsp; 
      <ion-icon name="newspaper-outline"></ion-icon> {{statusTitle}} Orders
    </ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-item lines="full">
    <ion-grid>
    <ion-row class="table-head">
      <ion-col size="3">#</ion-col>
      <!-- <ion-col>Date</ion-col> -->
      <ion-col size="4">Cost</ion-col>
      <ion-col size="3">Status</ion-col>
      <ion-col size="2">View</ion-col>
    </ion-row>
    </ion-grid>
    </ion-item>
    <ion-item lines="full" *ngFor="let p of myOrders">
    <ion-grid>
      <ion-row>
        <ion-col size="3">{{p.order_id}}</ion-col>
        <!-- <ion-col>{{p.date_placed}}</ion-col> -->
        <ion-col size="4">{{p.amount | currency: 'Ksh'}}</ion-col>
        <ion-col size="3" class="status-progress" *ngIf="oStatus === '0'"><ion-badge color="medium">Pending</ion-badge></ion-col>
        <ion-col size="3" class="status-progress" *ngIf="oStatus === '1'"><ion-badge color="secondary">Upaid</ion-badge></ion-col>
        <ion-col size="3" class="status-progress" *ngIf="oStatus === '2'"><ion-badge color="success">Paid</ion-badge></ion-col>
        <ion-col size="3" class="status-progress" *ngIf="oStatus === '3'"><ion-badge color="danger">Cancelled</ion-badge></ion-col>
        <ion-col size="3" class="status-progress" *ngIf="oStatus === '4'"><ion-badge color="success">Delivered</ion-badge></ion-col>
        <ion-col size="3" class="status-progress" *ngIf="oStatus === '5'"><ion-badge color="tertiary">Reviewed</ion-badge></ion-col>
        <ion-col size="2"><ion-button size="small" (click)="openOrder(p.order_id)"><ion-icon name="eye-off-outline"></ion-icon></ion-button></ion-col>
      </ion-row>
    </ion-grid>
  </ion-item>

</ion-content>
