<ion-header>
  <ion-toolbar>
    <ion-title><ion-icon name="settings-outline"></ion-icon> Account Setting</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-item (click)="myProfile()">
    <ion-icon name="person-circle-outline"></ion-icon>&nbsp;&nbsp; My Profile
  </ion-item>
  <ion-item (click)="changePassword()">
    <ion-icon name="lock-closed-outline"></ion-icon>&nbsp;&nbsp; Change Password
  </ion-item>
  <ion-item (click)="logout()">
    <ion-icon name="log-out-outline"></ion-icon>&nbsp;&nbsp; Logout
  </ion-item>


</ion-content>
