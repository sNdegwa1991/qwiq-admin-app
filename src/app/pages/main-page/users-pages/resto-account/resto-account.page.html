<ion-header>
  <ion-toolbar>
    <ion-title color="primary"><ion-icon name="home-outline"></ion-icon> {{restoName}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card class="orders-statistics">
    <ion-grid>
      <ion-row>
        <ion-col>
          <div>
            <ion-card (click)="openOrders('0')">
            
              <ion-card-content>
                <ion-badge color="medium">{{unconfirmed?.length}}</ion-badge><br>
                <strong>Unconfirmed <br>Orders</strong>
              </ion-card-content>
            </ion-card>
          </div>
        </ion-col>
        <ion-col>
          <div>
            <ion-card (click)="openOrders('2')">

              <ion-card-content>
                <ion-badge color="secondary">{{undelivered?.length}}</ion-badge><br>
                <strong>On transit<br> Orders</strong>
              </ion-card-content>
            </ion-card>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>

    <ion-grid>
      <ion-row>
        <ion-col>
          <div>
            <ion-card (click)="openOrders('4')">
            
              <ion-card-content>
                <ion-badge color="success">{{delivered?.length}}</ion-badge><br>
                <strong>Complete <br>Orders</strong>
              </ion-card-content>
            </ion-card>
          </div>
        </ion-col>
        <ion-col>
          <div>
            <ion-card (click)="openOrders('3')">

              <ion-card-content>
                <ion-badge color="danger">{{cancelled?.length}}</ion-badge><br>
                <strong>Cancelled<br> Orders</strong>
              </ion-card-content>
            </ion-card>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>

    <ion-grid>
      <ion-row>
        <ion-col>
          <div>
            <ion-card>
            
              <ion-card-content>
                <ion-badge color="tertiary">{{0}}</ion-badge><br>
                <strong>All <br>Products</strong>
              </ion-card-content>
            </ion-card>
          </div>
        </ion-col>
        <ion-col>
          <div>
           
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card>

</ion-content>
